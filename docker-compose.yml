services:
  mcp-proxy:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - mcp-proxy-data:/app/data
    environment:
      MCP_PROXY_ADMIN_PASS: ${MCP_PROXY_ADMIN_PASS:-changeme}
      MCP_PROXY_JWT_SECRET: ${MCP_PROXY_JWT_SECRET:-}
      MCP_PROXY_PORT: "8080"
      MCP_PROXY_DB: /app/data/mcp-proxy.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mcp-proxy-data:
