services:
  mcp-proxy:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - mcp-proxy-data:/app/data
    environment:
      # Core
      MCP_PROXY_ADMIN_PASS: ${MCP_PROXY_ADMIN_PASS:-changeme}
      MCP_PROXY_JWT_SECRET: ${MCP_PROXY_JWT_SECRET:-}
      MCP_PROXY_PORT: "8080"
      MCP_PROXY_DB: /app/data/mcp-proxy.db

      # Global encryption key (for env var at-rest encryption)
      # Falls back to JWT secret if not set
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # OIDC (e.g. PocketID) — set OIDC_ENABLED=true to activate
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mcp-proxy-data:
